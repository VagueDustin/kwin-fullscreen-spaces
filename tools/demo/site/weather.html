<!doctype html><html><head><meta charset="utf-8"><title>Weather — This Weekend</title>
<style>
 :root{--a:#c2683a}
 body{margin:0;font:17px/1.6 "Noto Sans",system-ui,sans-serif;color:#1d2433;background:linear-gradient(160deg,#f6f8fc,#e8eef8)}
 header{padding:56px 72px 40px;background:var(--a);color:#fff}
 header small{opacity:.8;letter-spacing:.12em;text-transform:uppercase;font-size:13px}
 h1{margin:6px 0 0;font-size:44px;font-weight:700}
 main{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:36px 72px}
 .card{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 6px 24px #1d243314}
 .card b{display:block;font-size:20px;margin-bottom:4px}
 .card span{color:#5b6476;font-size:15px}
 .big{font-size:38px;font-weight:700;color:var(--a)}
</style></head><body><header><small>Forecast</small><h1>This Weekend</h1></header><main><div class="card"><b>Saturday</b><div class="big">18°</div><span>Sunny, light wind</span></div><div class="card"><b>Sunday</b><div class="big">15°</div><span>Clouds after 2 pm</span></div><div class="card"><b>Monday</b><div class="big">12°</div><span>Showers likely</span></div></main></body></html>
